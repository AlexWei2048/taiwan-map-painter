name: Import documented emblem for elected historical party
on:
  push:
    branches: [main]
    paths:
      - scripts/import_verified_seated_party_emblem.py
      - .github/workflows/verified-seated-party-emblem.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-elected-historical-party-mark
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source and image verification dependencies
        run: python -m pip install -q requests beautifulsoup4 pillow opencc-python-reimplemented
      - name: Match exact historic party and verified official registered logo
        run: python scripts/import_verified_seated_party_emblem.py
      - name: Refresh all historic election icon coverage
        run: python scripts/audit_site_coverage.py
      - name: Validate image provenance, elected coverage and label corrections
        run: |
          node --test tests/party-logo-coverage.test.cjs tests/historical-elected-party-identity.test.cjs
          python - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('assets/party-logos-sourced.js').read_text()
          logos=json.loads(re.search(r'const SOURCED_PARTY_LOGOS_BY_NAME=(\{.*?\});',s,re.S).group(1))
          assert logos['中华民族致公党'].startswith('data:image/png;base64,')
          report=json.loads(Path('reports/coverage-audit.json').read_text())
          assert not any(x['name']=='中华民族致公党' for x in report['missing_elected_party_logos'])
          assert not any(x['name']=='中国台湾少数民族党' for x in report['missing_archive_logos'])
          print("Elected historical party emblem: government-source verified")
          PY
      - name: Commit source-backed image and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/party-logos-sourced.js assets/LICENSE-party-logos-sourced.txt reports/official-party-logos-import.json reports/coverage-audit.json reports/coverage-audit.md index.html
          if ! git diff --cached --quiet; then
            git commit -m "Embed official emblem of 2018 elected Chinese National Zhi Gong Party"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
