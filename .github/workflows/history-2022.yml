name: Build 2022 election history snapshot
on:
  push:
    paths:
      - scripts/build_history_2022.py
      - .github/workflows/history-2022.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/build_history_2022.py
      - name: Commit completed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-2022.json
          if ! git diff --cached --quiet; then
            git commit -m "Add official-source 2022 historical election results snapshot"
            git push
          fi
