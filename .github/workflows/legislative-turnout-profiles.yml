name: Verify CEC legislative geographic turnout profiles
on:
  push:
    branches: [main]
    paths:
      - scripts/build_history_legislative_turnout.py
      - .github/workflows/legislative-turnout-profiles.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legislative-turnout-build
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified-source reader
        run: python -m pip install requests opencc-python-reimplemented
      - name: Download and reconcile CEC election profiles against candidate votes
        run: python scripts/build_history_legislative_turnout.py
      - name: Validate JSON profiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for year in (1995,1998,2001,2004,2008,2012,2016):
              item=json.loads(Path(f'assets/history-legislative-turnout-{year}.json').read_text())
              assert item['year']==year
              assert sum(bool(x.get('national')) for x in item['ballots'].values())>=2,year
              for key, stats in item['ballots'].items():
                  print(year,key, {scope:len(entries) for scope,entries in stats.items()})
          PY
      - name: Commit only verified geographic profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-legislative-turnout-????.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish CEC-reconciled 1995-2016 legislative local turnout"
            git push origin HEAD:main
          fi
