name: Import verified official Taiwan historical party emblems
on:
  push:
    branches: [main]
    paths:
      - scripts/import_official_party_logos.py
      - .github/workflows/import-official-party-logos.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: verified-party-logo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow requests beautifulsoup4 opencc-python-reimplemented cairosvg pymupdf
      - run: python scripts/import_official_party_logos.py
      - name: Check sourced images and data URI shape
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          r=json.loads(Path("reports/official-party-logos-import.json").read_text())
          assert r["count_by_id"]>=8,r["count_by_id"]
          assert r["count_by_historical_name"]>=18,r["count_by_historical_name"]
          s=Path("assets/party-logos-sourced.js").read_text()
          assert re.search(r"const SOURCED_PARTY_LOGOS_BY_ID=\{",s)
          from urllib.parse import urlparse
          approved={"ws.moi.gov.tw","upload.wikimedia.org","www.ssfpp.tw","static.wixstatic.com","xn--2lw665d.tw","election.ltn.com.tw","feature.nextapple.com","ftpmirror.your.org","img.ltn.com.tw","bulletin.cec.gov.tw","ivoter.tw","www.ivoter.tw"}
          legacy_flags={"https://commons.wikimedia.org/wiki/Special:Redirect/file/Flag_of_Chinese_Youth_Party.svg","https://commons.wikimedia.org/wiki/Special:Redirect/file/台灣工黨黨旗.svg"}
          assert all((urlparse(x["official_image"]).hostname in approved or x["official_image"] in legacy_flags)
                     and x.get("source_sha256") and x.get("official_registry")
                     for x in r["official_sources"])
          print("Imported",r["count_by_id"],"preset logos and",r["count_by_historical_name"],"historical logos")
          PY
      - name: Publish only verified, source-attributed party emblems
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import re,hashlib
          from pathlib import Path
          version=hashlib.sha256(Path("assets/party-logos-sourced.js").read_bytes()).hexdigest()[:12]
          for name in ("index.html","map-v60.html"):
              p=Path(name)
              text=p.read_text()
              p.write_text(re.sub(r"party-logos-sourced\.js\?v=[^\"]+", "party-logos-sourced.js?v="+version,text))
          PY
          python scripts/audit_site_coverage.py
          git add assets/party-logos-sourced.js assets/LICENSE-party-logos-sourced.txt reports/official-party-logos-import.json reports/coverage-audit.json reports/coverage-audit.md index.html map-v60.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified ministry-registered historical party emblems with source attribution"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
