name: Build presidential election year shards
on:
  push:
    branches:
      - main
      - feature/history-presidential-1996-2024-20261111
    paths:
      - scripts/build_history_presidential.py
      - tests/test_history_presidential_builder.py
      - .github/workflows/history-presidential.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-presidential-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public data parser dependencies
        run: python -m pip install requests beautifulsoup4 opencc-python-reimplemented
      - name: Test source validation and aggregates
        run: python -m unittest discover -s tests -p 'test_history_presidential_builder.py' -v
      - name: Generate eight atomic presidential data snapshots
        run: python scripts/build_history_presidential.py
      - name: Verify published snapshots against CEC totals
        run: python scripts/build_history_presidential.py --verify-existing
      - name: Commit validated data shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/history-president-*.json sources/history-presidential-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data(history): publish verified 1996-2024 presidential shards"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
