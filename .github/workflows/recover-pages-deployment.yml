name: Recover stale Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-pages-deployment.yml'
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pages/deployments/740ac78b6f2d057cfe24389ed4081b5343ad8e64"
      - name: Cancel stalled Pages deployment so new commits can publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/pages/deployments/740ac78b6f2d057cfe24389ed4081b5343ad8e64/cancel"
          echo "Cancelled old Pages deployment; new release can now publish."
