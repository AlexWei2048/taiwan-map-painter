name: Verify and enrich 2022 mayoral town turnout
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_history_2022_town_profiles.py
      - .github/workflows/history-town-profiles.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history-town-profiles-main
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: python -m pip install requests beautifulsoup4 opencc-python-reimplemented
      - name: Enrich only official 2022 mayor ward turnout
        run: python scripts/enrich_history_2022_town_profiles.py --write
      - name: Verify published snapshot independently
        run: |
          python scripts/build_history_2022.py --verify-existing
          python scripts/enrich_history_2022_town_profiles.py --verify-existing
          node --test tests/history-model.test.cjs tests/history-overview-scopes.test.cjs
      - name: Publish only validated source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-2022.json
          if ! git diff --cached --quiet; then
            git commit -m "Enrich 366 mayoral wards with CEC-verified 2022 voter turnout"
            git push origin HEAD:main
          fi
