name: NCCU historical candidate backfill
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nccu-backfill.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nccu-historical-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NCCU parsing dependencies
        run: python -m pip install -q beautifulsoup4 lxml opencc-python-reimplemented
      - name: Backfill verified historical candidate records from NCCU
        run: python scripts/backfill_nccu_candidate_profiles.py --years 1993 1994 1997 1998 2001 2002 2005 2006 2009 2010 2014 2018 --apply
      - name: Validate historical records and imported data
        run: node --test tests/history-local.test.cjs tests/history-import.test.cjs tests/history-model.test.cjs
      - name: Publish verified source data to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-local-*.json reports/nccu-candidate-reconciliation.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Backfill and reconcile NCCU historical candidate profiles"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nccu-candidate-reconciliation
          path: reports/nccu-candidate-reconciliation.json
