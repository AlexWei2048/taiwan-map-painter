name: Audit 1996-2024 presidential township election data
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_history_presidential_towns.py
      - .github/workflows/history-presidential-town-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 opencc-python-reimplemented
      - run: python scripts/build_history_presidential.py --verify-existing
      - run: python scripts/audit_history_presidential_towns.py
      - run: node --test tests/history-presidential.test.cjs tests/history-overview-scopes.test.cjs
