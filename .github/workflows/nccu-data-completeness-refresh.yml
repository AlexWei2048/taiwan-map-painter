name: Refresh historical data completeness after verified backfills
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nccu-data-completeness-refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve prior manual research and refresh generated completeness audit
        shell: bash
        run: |
          cp reports/data-completeness.md /tmp/old-data-completeness.md
          node scripts/audit_data_completeness.cjs
          python - <<'PY'
          import pathlib,json
          path=pathlib.Path('reports/data-completeness.md')
          previous=pathlib.Path('/tmp/old-data-completeness.md').read_text('utf8')
          updated=path.read_text('utf8')
          marker='## 人工复核与下一阶段优先级'
          history=previous[previous.index(marker):] if marker in previous else ''
          latest='''## 1998年共享妇保补录与2020/2024乡镇统计审计校正（2026-11-25）

          - 依据2009、2014、2018年当届选举公告，校正24组、90个少数民族议员选区的共享妇女保障名额，消除86条待核实项，修正4条此前单区记录。正数共享名额不重复算入各个选区，零席共享组明确标记0。公告原始链接随数据存储。
          - 1998年花莲县平地、台东县平地及山地3组共享妇女保障名额，依据当届适用法制及历史结果注释交叉核对，新增12个选区成员记录。该年合计24个共享组成员选区及14个有来源的单区零席记录，共38条；正数共享名额仅在组层级计算，不重复分配至各成员选区。
          - 2008、2012、2016年各补12个跨选区乡镇投票统计，按原始投票所与选区乡镇小计双向汇总、独立候选人得票和县市四字段总数核对。
          - 中选会原始elbase/elprof镜像另恢复2004年11条及2008年3条乡镇统计，均有原始行政代码、候选人票数与县市合计验证。共新增50条乡镇统计。
          - 2020、2024年区域民代各368个乡镇市区投票概况已存于对应turnout JSON，按中选会原始elbase/elprof、乡镇候选人有效票与县市四字段总数逐项对账；本轮重新生成完整性报告，避免把已存在的乡镇统计继续列为缺失。
          '''
          lines='\n'.join(x.lstrip(' ') if x.startswith('          ') else x for x in latest.splitlines())
          if lines.splitlines()[0] not in history:
              history=history.rstrip()+'\n\n'+lines.strip()
          path.write_text(updated.rstrip()+'\n\n'+history.rstrip()+'\n','utf8')
          report=json.loads(pathlib.Path('reports/data-completeness.json').read_text('utf8'))
          print('REGENERATED_COUNTS',json.dumps(report['counts'],ensure_ascii=False))
          print('REGENERATED_ERRORS',json.dumps(report['errors'],ensure_ascii=False))
          assert not report['errors']
          assert '共享妇保' in lines
          PY
      - name: Validate candidate and turnout records
        run: node --test tests/history-legislative-district-profiles.test.cjs tests/history-legislative-data.test.cjs tests/history-local.test.cjs
      - name: Commit updated audit without losing historical research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/data-completeness.json reports/data-completeness.csv reports/data-completeness.md
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh election completeness audit after quota and town backfill'
            git push origin HEAD:main
          fi
