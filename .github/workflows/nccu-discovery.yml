name: NCCU archive link discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nccu-discovery.yml']
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect NCCU subregional summaries and candidate vote tables
        run: |
          python -m pip install -q beautifulsoup4 lxml
          python - <<'PY'
          import urllib.request, urllib.parse
          from bs4 import BeautifulSoup
          base='https://vote.nccu.edu.tw/cec/'
          for yr,cat in [(1998,'H'),(1998,'G'),(1994,'EM'),(2002,'G')]:
            root=base+f'ceclist.asp?y={yr}&t={cat}'
            try:
              soup=BeautifulSoup(urllib.request.urlopen(root,timeout=20).read(),'lxml')
              link=next(a.get('href') for a in soup.find_all('a',href=True) if 'vote421.asp' in a.get('href'))
              url=urllib.parse.urljoin(root,link)
              s=BeautifulSoup(urllib.request.urlopen(url,timeout=20).read(),'lxml')
              detail=next(a.get('href') for a in s.find_all('a',href=True) if 'vote4211.asp' in a.get('href'))
              durl=urllib.parse.urljoin(url,detail)
              d=BeautifulSoup(urllib.request.urlopen(durl,timeout=20).read(),'lxml')
              print('\\nCAT',yr,cat,'URL',durl,'TITLE',d.title.get_text() if d.title else '')
              print('TEXT',d.get_text(' ',strip=True)[:500])
              print('ROWS',[[td.get_text(' ',strip=True)[:35] for td in tr.find_all(['td','th'])][:18] for tr in d.find_all('tr')[:10]])
              print('LINKS',[a.get('href') for a in d.find_all('a',href=True)[:6]])
            except Exception as e: print('ERROR',yr,cat,repr(e))
          for yr,cat in [(1998,'H'),(1998,'G')]:
            root=base+f'ceclist.asp?y={yr}&t={cat}'
            try:
              soup=BeautifulSoup(urllib.request.urlopen(root,timeout=20).read(),'lxml')
              link=next(a.get('href') for a in soup.find_all('a',href=True) if 'vote413.asp' in a.get('href'))
              url=urllib.parse.urljoin(root,link)
              s=BeautifulSoup(urllib.request.urlopen(url,timeout=20).read(),'lxml')
              detail=next(a.get('href') for a in s.find_all('a',href=True) if 'vote3.asp' in a.get('href'))
              durl=urllib.parse.urljoin(url,detail)
              d=BeautifulSoup(urllib.request.urlopen(durl,timeout=20).read(),'lxml')
              print('\\nCANDIDATE',yr,cat,'URL',durl,'TITLE',d.title.get_text() if d.title else '')
              print('TEXT',d.get_text(' ',strip=True)[:600])
              print('ROWS',[[td.get_text(' ',strip=True)[:35] for td in tr.find_all(['td','th'])][:18] for tr in d.find_all('tr')[:9]])
              print('LINKS',[a.get('href') for a in d.find_all('a',href=True)[:6]])
            except Exception as e:print('ERROR',yr,cat,repr(e))
          PY
