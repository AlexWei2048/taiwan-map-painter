name: NCCU archive link discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nccu-discovery.yml']
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate archival types and direct candidate links
        run: |
          python -m pip install -q beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.request import urlopen
          for y,t in [(1993,'F'),(1994,'EM'),(1994,'DM'),(1998,'EM'),(1998,'DM'),(2002,'DM'),(2002,'F'),(2005,'F'),(2006,'EM'),(2014,'EM'),(2018,'DM')]:
            url=f'https://vote.nccu.edu.tw/cec/ceclist.asp?y={y}&t={t}'
            try:
              soup=BeautifulSoup(urlopen(url,timeout=15).read(),'html.parser')
              a=[(x.get('href'),x.get('title'),x.parent.get_text(' ',strip=True)[:40]) for x in soup.select('a[href]')]
              print('YEAR',y,'TYPE',t,'LINKS',a[:9],flush=True)
            except Exception as e:print('ERROR',y,t,repr(e),flush=True)
          PY
