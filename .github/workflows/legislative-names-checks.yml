name: Validate legislative historical name corrections
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legislative-names-checks.yml
      - scripts/build_history_legislative.py
      - scripts/apply_legislative_name_corrections.py
      - tests/test_history_legislative_builder.py
      - sources/history-legislative-name-corrections.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test requirements
        run: python -m pip install pytest requests beautifulsoup4 opencc-python-reimplemented
      - name: Verify source builder handles official spelling exceptions
        run: python -m pytest tests/test_history_legislative_builder.py -q
      - name: Verify all published JSON shards against their source manifest
        run: python scripts/build_history_legislative.py --verify-existing
      - name: Reject unresolved decomposed glyphs and invalid Unicode
        run: python scripts/audit_legislative_names.py --strict > /tmp/legislative-name-audit.md
