name: NCCU 1992 regional voting-data discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nccu-1992-discovery.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect 1992 and 1995 regional legislative turnout
        run: |
          python -m pip install -q beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          import urllib.request
          for year,code in [(1992,'J9AA:I8888888888'),(1995,'J9AA=I8888888888')]:
            u=f'https://vote.nccu.edu.tw/cec/vote421.asp?pass1={code}'
            try:
              d=BeautifulSoup(urllib.request.urlopen(u,timeout=45).read(),'html.parser')
              rows=[[v.get_text(' ',strip=True)[:42] for v in tr.find_all(['td','th'],recursive=False)] for tr in d.find_all('tr')]
              print('YEAR',year,'TITLE',d.title.get_text(' ',strip=True) if d.title else None,'ROWS',len(rows),flush=True)
              for a in rows[:40]:
                if a:print('ROW',year,a[:18],flush=True)
              print('LINKS',year,[a.get('href') for a in d.select('a[href]')[:18]],flush=True)
            except Exception as exc:print('ERROR',year,repr(exc),flush=True)
          PY
