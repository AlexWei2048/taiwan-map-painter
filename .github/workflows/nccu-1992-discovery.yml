name: NCCU 1992 regional voting-data discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nccu-1992-discovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Print NCCU legislature election turnout table structure
        shell: bash
        run: |
          python -m pip install -q beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          import urllib.request,urllib.parse
          for year in (1992,1995,1998):
            url=f'https://vote.nccu.edu.tw/cec/ceclist.asp?y={year}&t=B'
            try:
              d=BeautifulSoup(urllib.request.urlopen(url,timeout=20).read(),'html.parser')
              links=[(a.get('href'),a.parent.get_text(' ',strip=True)[:30]) for a in d.select('a[href]') if any(s in a.get('href','').lower() for s in ('vote4','vote2'))]
              print('YEAR',year,'LINKS',links[:9],flush=True)
              for href,_ in links[:2]:
                src=urllib.parse.urljoin(url,href)
                s=BeautifulSoup(urllib.request.urlopen(src,timeout=20).read(),'html.parser')
                print('SOURCE',src,'TITLE',s.title.get_text(' ',strip=True) if s.title else '',flush=True)
                print('ROWS',[[x.get_text(' ',strip=True)[:40] for x in tr.find_all(['td','th'],recursive=False)][:17] for tr in s.find_all('tr')[:19]],flush=True)
                print('CHILD_LINKS',[a.get('href') for a in s.select('a[href]')[:10]],flush=True)
            except Exception as e:print('ERROR',year,repr(e),flush=True)
          PY
