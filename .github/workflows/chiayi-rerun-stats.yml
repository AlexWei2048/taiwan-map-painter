name: Complete verified 2022 Chiayi mayoral rerun ward statistics
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_2022_chiayi_rerun.py
      - .github/workflows/chiayi-rerun-stats.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install opencc-python-reimplemented
      - run: python scripts/enrich_2022_chiayi_rerun.py
      - name: Confirm distinct source date and exact city/ward total
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('assets/history-2022.json').read_text())
          r=json.loads(Path('reports/2022-chiayi-mayor-rerun-turnout.json').read_text())
          assert r["whole_city"]["registered_voters"]==214130
          assert r["whole_city"]["valid_votes"]==93813
          records=[p for p in a["townProfiles"] if p["office"]=="mayor" and p["county"]=="嘉义市"]
          assert len(records)==2 and {p["town"] for p in records}=={"东区","西区"}
          print("Chiayi mayor December rerun CEC ballot profiles:",records)
          PY
      - name: Publish only source-reconciled ward turnout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-2022.json reports/2022-chiayi-mayor-rerun-turnout.json
          if ! git diff --cached --quiet; then
            git commit -m "Fill official 2022 Chiayi mayor rerun turnout for East and West wards"
            git push origin HEAD:main
          fi
