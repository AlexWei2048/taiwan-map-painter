name: Verify all 81 CEC-qualified 2026 mayors across 22 counties
on:
  push:
    paths:
      - scripts/audit_2026_mayor_qualifications.py
      - sources/election-2026/official-mayors-20261016.json
      - assets/election-2026.js
      - tests/test_2026_mayor_qualifications.py
      - .github/workflows/cec-2026-mayor-roster.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p test_2026_mayor_qualifications.py
          python scripts/audit_2026_mayor_qualifications.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cec-qualified-mayor-2026-audit
          path: reports/2026-all-mayor-qualification-audit.json
          if-no-files-found: warn
