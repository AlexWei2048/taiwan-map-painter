name: Diagnose 2004 Kaohsiung map rendering
on:
  push:
    paths:
      - scripts/inspect_2004_kaohsiung_browser.mjs
      - .github/workflows/diagnose-2004-legislative-browser.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/map-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/inspect_2004_kaohsiung_browser.mjs
