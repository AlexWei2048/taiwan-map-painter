name: Audit 2022 CEC source archive
on:
  push:
    branches: [data/cec-2022-fill-missing-20261110]
    paths: [.github/workflows/audit-cec-2022.yml, scripts/audit_cec_2022.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_cec_2022.py
