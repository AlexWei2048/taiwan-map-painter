name: Audit 2022 CEC source archive
on:
  push:
    branches: [data/cec-2022-fill-missing-20261110]
    paths: [.github/workflows/audit-cec-2022.yml, scripts/audit_cec_2022.py, scripts/enrich_history_2022_cec.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install opencc-python-reimplemented requests beautifulsoup4
      - run: python scripts/enrich_history_2022_cec.py --write
      - name: Commit complete, validated CEC 2022 dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/history-2022.json
          if ! git diff --cached --quiet; then
            git commit -m 'Complete 2022 election records using official CEC data'
            git push
          fi
