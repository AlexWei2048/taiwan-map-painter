name: Audit election party logos and data completeness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_site_coverage.py
      - assets/party-logos-sourced.js
      - reports/official-party-logos-import.json
      - .github/workflows/coverage-audit.yml
permissions:
  contents: write
concurrency:
  group: verified-party-logo-import
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install opencc-python-reimplemented
      - run: python scripts/audit_site_coverage.py
      - name: Publish gap audit for reproducible updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/coverage-audit.json reports/coverage-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Update audited party emblem and election data coverage report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
