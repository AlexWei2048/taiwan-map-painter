name: Validate official CEC 2022 historical enrichment
on:
  push:
    branches: [feature/2022-cec-official-enrichment-20261110]
    paths: ['scripts/enrich_history_cec.py', '.github/workflows/inspect-cec-2022.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder dependencies
        run: pip install -r requirements-build.txt
      - name: Match 2022 official CEC profiles and vote totals
        run: python scripts/enrich_history_cec.py --audit-only
