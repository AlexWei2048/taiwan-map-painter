name: Apply verified legislative name corrections
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legislative-name-fixes.yml
      - scripts/apply_legislative_name_corrections.py
      - sources/history-legislative-name-corrections.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legislative-verified-name-corrections
  cancel-in-progress: false
jobs:
  fix-names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Correct all granularities and candidacy identifiers
        run: python scripts/apply_legislative_name_corrections.py
      - name: Verify generated snapshots and SHA-256 hashes
        run: node --test tests/history-legislative.test.cjs
      - name: Refresh names audit
        run: python scripts/audit_legislative_names.py > docs/audits/legislative-names.md
      - name: Publish corrected snapshots and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-legislative-*.json sources/history-legislative-manifest.json docs/audits/legislative-names.md
          if ! git diff --cached --quiet; then
            git commit -m "Correct verified historic candidate names and SHA-256 hashes"
            git push origin HEAD:main
          fi
