name: Verify archived party 195 official emblem
on:
  push:
    branches: [main]
    paths:
      - scripts/import_verified_party195_emblem.py
      - .github/workflows/party195-emblem.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install audited image readers
        run: python -m pip install requests beautifulsoup4 pillow opencc-python-reimplemented
      - name: Validate party 195 logo against ministry page and embed
        run: python scripts/import_verified_party195_emblem.py
      - name: Update post-import party coverage inventory
        run: python scripts/audit_site_coverage.py
      - name: Assert complete verified logo manifest
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          js=Path('assets/party-logos-sourced.js').read_text()
          byid=json.loads(re.search(r'const SOURCED_PARTY_LOGOS_BY_ID=(\{.*?\});',js,re.S).group(1))
          assert byid['iisw'].startswith('data:image/png;base64,')
          sources=json.loads(Path('reports/official-party-logos-import.json').read_text())
          assert any(x.get('party_id')=='iisw' for x in sources['official_sources'])
          missing=json.loads(Path('reports/coverage-audit.json').read_text())['missing_preset_logos']
          assert all(x['id']!='iisw' for x in missing)
          print('Verified missing preset party emblems remaining:',len(missing))
          PY
      - name: Publish exact provenance and embedded asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/party-logos-sourced.js assets/LICENSE-party-logos-sourced.txt reports/official-party-logos-import.json reports/coverage-audit.json reports/coverage-audit.md index.html
          if ! git diff --cached --quiet; then
            git commit -m "Embed source-verified historic 制度救世岛 registered party emblem"
            git push origin HEAD:main
          fi
