name: Website regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculation and regression tests
        run: node --test test-ui-contract.cjs tests/*.test.cjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflows and downloaded files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/map-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --test tests/browser-smoke.mjs
